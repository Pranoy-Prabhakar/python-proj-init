# prek hooks — runs the project-managed tool versions via uv.
# Validate after edits: uv run prek validate-config prek.toml

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format"
language = "system"
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix"
language = "system"
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "ty-check"
name = "ty check"
entry = "uv run ty check"
language = "system"
pass_filenames = false
